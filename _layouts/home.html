---
layout: default
---
<section class="page-shell home-feed">
  <header class="page-header home-feed-header">
    <h1 class="page-title">Recent posts</h1>
    <p class="home-lede">{{ site.description }}</p>
  </header>
  {{ content }}
  {% include post_list.html posts=site.posts limit=6 variant="home" more_url="/articles/" more_label="Browse all articles" %}
  <p class="rss-subscribe">Follow via <a href="{{ "/feed.xml" | relative_url }}">RSS</a></p>
</section>
